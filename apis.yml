aid: capsule8
name: Capsule8
description: 'Capsule8 was a New York-based cybersecurity company (founded 2016) that built high-performance
  runtime visibility, detection, and response for Linux production servers and containers across on-premises
  and cloud workloads. Its open-source sensor exposed a gRPC (v0) telemetry API for subscribing to security
  events. Sophos acquired Capsule8 in July 2021 and absorbed the technology into its Adaptive Cybersecurity
  Ecosystem (Intercept X server protection, XDR, and Managed Threat Response). The capsule8.com domain now
  redirects to Sophos, the flagship open-source sensor/API repository has been removed, and no independent
  Capsule8 developer API, portal, or documentation remains live. This profile was surfaced as a Bessemer
  Venture Partners portfolio company and is retained as an acquired-company record.'
